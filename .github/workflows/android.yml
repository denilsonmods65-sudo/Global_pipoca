
name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-tv-export/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f "android-tv-export/build.gradle.kts" ]; then
            echo "dir=android-tv-export" >> "$GITHUB_OUTPUT"
          elif [ -f "android/build.gradle.kts" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          else
            echo "Projeto Android não encontrado."
            exit 1
          fi

      - name: Enable AndroidX
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          touch gradle.properties
          grep -q '^android.useAndroidX=true$' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=true$' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --version
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOCTRA-PLAY-APK
          path: |
            android-tv-export/build/outputs/apk/debug/*.apk
            android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
