
name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web project
        run: bun run build

      - name: Apply Custom App Icon
        run: |
          ICON_FILE="file_000000004660820ebf6d6dfc334fcee.png"

          if [ -f "$ICON_FILE" ]; then
            echo "Aplicando ícone personalizado..."

            if [ -d "android-tv-export/src/main/res" ]; then
              RES_DIR="android-tv-export/src/main/res"
            elif [ -d "android/app/src/main/res" ]; then
              RES_DIR="android/app/src/main/res"
            elif [ -d "android-tv-export/app/src/main/res" ]; then
              RES_DIR="android-tv-export/app/src/main/res"
            else
              RES_DIR=""
            fi

            if [ -n "$RES_DIR" ]; then
              for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
                mkdir -p "$RES_DIR/$folder"
                cp "$ICON_FILE" "$RES_DIR/$folder/ic_launcher.png"
                cp "$ICON_FILE" "$RES_DIR/$folder/ic_launcher_round.png"
              done
              echo "Ícone aplicado com sucesso!"
            else
              echo "Pasta de recursos Android não encontrada."
            fi
          else
            echo "Arquivo de ícone não encontrado."
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd android-tv-export
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOCTRA-PLAY-APK
          path: android-tv-export/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
