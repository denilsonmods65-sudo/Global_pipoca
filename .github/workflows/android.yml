name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ -f "bun.lock" ]; then
            bun install --frozen-lockfile || bun install
          else
            npm install
          fi

      - name: Build web project
        run: |
          if command -v bun &> /dev/null; then
            bun run build
          else
            npm run build
          fi

      - name: Package Web Assets for Android
        run: |
          echo "Empacotando aplicação web para assets Android..."
          mkdir -p android-tv-export/src/main/assets/www
          cp -r dist/* android-tv-export/src/main/assets/www/
          ls -la android-tv-export/src/main/assets/www/

      - name: Set up ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Inject App Icon and Android TV Banner
        run: |
          echo "Processando e injetando ícone original e banner do Android TV..."
          
          RES_DIR="android-tv-export/src/main/res"
          mkdir -p "$RES_DIR/drawable"
          mkdir -p "$RES_DIR/mipmap-mdpi"
          mkdir -p "$RES_DIR/mipmap-hdpi"
          mkdir -p "$RES_DIR/mipmap-xhdpi"
          mkdir -p "$RES_DIR/mipmap-xxhdpi"
          mkdir -p "$RES_DIR/mipmap-xxxhdpi"

          # 1. Localizar a imagem do logo original (ic_noctra_logo.png, file_*.png ou similar)
          LOGO_SRC=""
          for cand in \
            "ic_noctra_logo.png" \
            $(find . -maxdepth 2 -name "file_*.png" 2>/dev/null) \
            $(find . -name "*noctra_logo*.png" 2>/dev/null) \
            $(find . -name "*logo*.png" ! -path "*/android-tv-export/src/main/res/*" 2>/dev/null) \
            "$RES_DIR/drawable/ic_noctra_logo.png"; do
            if [ -f "$cand" ] && [ $(wc -c < "$cand") -gt 100 ]; then
              LOGO_SRC="$cand"
              echo "Logo original encontrado: $LOGO_SRC ($(wc -c < "$cand") bytes)"
              break
            fi
          done

          # 2. Copiar automaticamente para as pastas de recursos do Android
          if [ -n "$LOGO_SRC" ] && [ -f "$LOGO_SRC" ]; then
            # Copiar diretamente para drawable/ic_noctra_logo.png
            cp -f "$LOGO_SRC" "$RES_DIR/drawable/ic_noctra_logo.png"
            echo "Copiado com sucesso para $RES_DIR/drawable/ic_noctra_logo.png"

            # Gerar mipmaps (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi)
            if command -v convert &> /dev/null; then
              echo "Gerando mipmaps otimizados com ImageMagick..."
              convert "$LOGO_SRC" -resize 48x48 "$RES_DIR/mipmap-mdpi/ic_launcher.png"
              cp -f "$RES_DIR/mipmap-mdpi/ic_launcher.png" "$RES_DIR/mipmap-mdpi/ic_launcher_round.png"

              convert "$LOGO_SRC" -resize 72x72 "$RES_DIR/mipmap-hdpi/ic_launcher.png"
              cp -f "$RES_DIR/mipmap-hdpi/ic_launcher.png" "$RES_DIR/mipmap-hdpi/ic_launcher_round.png"

              convert "$LOGO_SRC" -resize 96x96 "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
              cp -f "$RES_DIR/mipmap-xhdpi/ic_launcher.png" "$RES_DIR/mipmap-xhdpi/ic_launcher_round.png"

              convert "$LOGO_SRC" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
              cp -f "$RES_DIR/mipmap-xxhdpi/ic_launcher.png" "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png"

              convert "$LOGO_SRC" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"
              cp -f "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png" "$RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png"
            else
              echo "ImageMagick não disponível, copiando direto para pastas mipmap..."
              for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
                cp -f "$LOGO_SRC" "$RES_DIR/mipmap-$dens/ic_launcher.png"
                cp -f "$LOGO_SRC" "$RES_DIR/mipmap-$dens/ic_launcher_round.png"
              done
            fi
            echo "Ícones de launcher gerados em todas as pastas mipmap-* com sucesso!"
          else
            echo "Aviso: Nenhuma imagem válida para o logo original foi encontrada."
          fi

          # 3. Localizar e injetar banner do Android TV (320x180 leanback padrão)
          BANNER_SRC=""
          for b_cand in \
            "src/assets/images/noctra_tv_banner_1792121160514.jpg" \
            $(find src -name "*banner*.jpg" -o -name "*banner*.png" 2>/dev/null) \
            $(find . -name "*tv_banner*.png" ! -path "*/android-tv-export/src/main/res/*" 2>/dev/null) \
            "$RES_DIR/drawable/noctra_tv_banner.png"; do
            if [ -f "$b_cand" ] && [ $(wc -c < "$b_cand") -gt 100 ]; then
              BANNER_SRC="$b_cand"
              echo "Banner original encontrado: $BANNER_SRC"
              break
            fi
          done

          if [ -n "$BANNER_SRC" ]; then
            if command -v convert &> /dev/null; then
              convert "$BANNER_SRC" -resize 320x180^ -gravity center -extent 320x180 "$RES_DIR/drawable/noctra_tv_banner.png"
            else
              cp -f "$BANNER_SRC" "$RES_DIR/drawable/noctra_tv_banner.png"
            fi
            echo "Banner de TV injetado com sucesso em $RES_DIR/drawable/noctra_tv_banner.png"
          fi

          echo "Status final dos recursos injetados:"
          ls -lh "$RES_DIR/drawable/"
          ls -lh "$RES_DIR"/mipmap-*/

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK with Gradle
        run: |
          cd android-tv-export
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOCTRA-PLAY-TV-APK
          path: android-tv-export/build/outputs/apk/debug/*.apk
          if-no-files-found: error
