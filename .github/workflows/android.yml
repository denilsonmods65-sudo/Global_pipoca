name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ -f "bun.lock" ]; then
            bun install --frozen-lockfile || bun install
          else
            npm install
          fi

      - name: Build web project
        run: |
          if command -v bun &> /dev/null; then
            bun run build
          else
            npm run build
          fi

      - name: Package Web Assets for Android
        run: |
          echo "Empacotando aplicação web para assets Android..."
          mkdir -p android-tv-export/src/main/assets/www
          cp -r dist/* android-tv-export/src/main/assets/www/
          ls -la android-tv-export/src/main/assets/www/

      - name: Set up ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Generate App Icons and TV Banner
        run: |
          echo "Processando ícones e banner do aplicativo Android TV..."
          
          # Detect icon file regardless of minor naming differences
          ICON_FILE=$(ls file_*.png 2>/dev/null | head -n 1)
          
          RES_DIR="android-tv-export/src/main/res"
          mkdir -p "$RES_DIR/drawable"
          mkdir -p "$RES_DIR/mipmap-mdpi"
          mkdir -p "$RES_DIR/mipmap-hdpi"
          mkdir -p "$RES_DIR/mipmap-xhdpi"
          mkdir -p "$RES_DIR/mipmap-xxhdpi"
          mkdir -p "$RES_DIR/mipmap-xxxhdpi"

          if [ -n "$ICON_FILE" ] && [ -f "$ICON_FILE" ]; then
            echo "Gerando mipmaps a partir de: $ICON_FILE"
            convert "$ICON_FILE" -resize 48x48 "$RES_DIR/mipmap-mdpi/ic_launcher.png"
            cp "$RES_DIR/mipmap-mdpi/ic_launcher.png" "$RES_DIR/mipmap-mdpi/ic_launcher_round.png"
            
            convert "$ICON_FILE" -resize 72x72 "$RES_DIR/mipmap-hdpi/ic_launcher.png"
            cp "$RES_DIR/mipmap-hdpi/ic_launcher.png" "$RES_DIR/mipmap-hdpi/ic_launcher_round.png"
            
            convert "$ICON_FILE" -resize 96x96 "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
            cp "$RES_DIR/mipmap-xhdpi/ic_launcher.png" "$RES_DIR/mipmap-xhdpi/ic_launcher_round.png"
            
            convert "$ICON_FILE" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
            cp "$RES_DIR/mipmap-xxhdpi/ic_launcher.png" "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png"
            
            convert "$ICON_FILE" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"
            cp "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png" "$RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png"
            echo "Ícones gerados com sucesso!"
          else
            echo "Aviso: Imagem de ícone não encontrada no root."
          fi

          # Generate TV Banner if not already present
          BANNER_SRC="src/assets/images/noctra_tv_banner_1792121160514.jpg"
          if [ -f "$BANNER_SRC" ] && [ ! -f "$RES_DIR/drawable/noctra_tv_banner.png" ]; then
            convert "$BANNER_SRC" -resize 320x180^ -gravity center -extent 320x180 "$RES_DIR/drawable/noctra_tv_banner.png"
            echo "Banner de TV gerado com sucesso!"
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK with Gradle
        run: |
          cd android-tv-export
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOCTRA-PLAY-TV-APK
          path: android-tv-export/build/outputs/apk/debug/*.apk
          if-no-files-found: error
