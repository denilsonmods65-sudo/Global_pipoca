name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web project
        run: bun run build

      - name: Apply Custom App Icon
        run: |
          ICON_FILE="file_000000004660820ebf6dd6dfc334fcee.png"
          if [ -f "$ICON_FILE" ]; then
            echo "A aplicar o ícone personalizado do Global Pipoca..."
            if [ -d "android-tv-export/app/src/main/res" ]; then
              RES_DIR="android-tv-export/app/src/main/res"
            elif [ -d "android/app/src/main/res" ]; then
              RES_DIR="android/app/src/main/res"
            else
              RES_DIR=""
            fi
            
            if [ -n "$RES_DIR" ]; then
              for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
                mkdir -p "$RES_DIR/$folder"
                cp "$ICON_FILE" "$RES_DIR/$folder/ic_launcher.png"
                cp "$ICON_FILE" "$RES_DIR/$folder/ic_launcher_round.png"
              done
              echo "Ícone aplicado com sucesso!"
            fi
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Export & Build APK
        run: |
          if [ -d "android-tv-export" ]; then
            cd android-tv-export
          elif [ -d "android" ]; then
            cd android
          else
            CD_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
            cd "$CD_DIR"
          fi
          
          # Se o gradlew não existir, gera-o automaticamente na hora
          if [ ! -f "gradlew" ]; then
            echo "Ficheiro gradlew em falta. A gerar wrapper do Gradle..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Pipoca-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
            
